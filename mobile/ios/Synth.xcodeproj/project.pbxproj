			shellScript = "set -e\nif [[ -f \"$PODS_ROOT/../.xcode.env\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env\"\nfi\nif [[ -f \"$PODS_ROOT/../.xcode.env.local\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env.local\"\nfi\nif [[ -f \"$PODS_ROOT/../.xcode.env.updates\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env.updates\"\nfi\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:${PATH}\"\nexport CI=false\nif [[ -z \"${NODE_BINARY:-}\" || ! -x \"${NODE_BINARY}\" ]]; then\n  echo \"error: Bundle React Native — NODE_BINARY missing. Check ci_post_clone / ci_pre_xcodebuild.\" >&2\n  exit 1\nfi\n\n# The project root by default is one level up from the ios directory\nexport PROJECT_ROOT=\"$PROJECT_DIR\"/..\n\nif [[ \"$CONFIGURATION\" = *Debug* ]]; then\n  export SKIP_BUNDLING=1\nelse\n  export NODE_ENV=production\nfi\nif [[ -z \"$ENTRY_FILE\" ]]; then\n  # Set the entry JS file using the bundler's entry resolution.\n  export ENTRY_FILE=\"$(\"$NODE_BINARY\" -e \"require('expo/scripts/resolveAppEntry')\" \"$PROJECT_ROOT\" ios absolute | tail -n 1)\"\nfi\n\nif [[ -z \"$CLI_PATH\" ]]; then\n  # Use Expo CLI\n  export CLI_PATH=\"$(\"$NODE_BINARY\" --print \"require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })\")\"\nfi\nif [[ -z \"$BUNDLE_COMMAND\" ]]; then\n  # Default Expo CLI command for bundling\n  export BUNDLE_COMMAND=\"export:embed\"\nfi\n\nif [[ -z \"$ENTRY_FILE\" || ! -f \"$ENTRY_FILE\" ]]; then\n  echo \"error: Bundle React Native — ENTRY_FILE missing or not found (${ENTRY_FILE:-})\" >&2\n  exit 1\nfi\nif [[ -z \"$CLI_PATH\" || ! -f \"$CLI_PATH\" ]]; then\n  echo \"error: Bundle React Native — CLI_PATH missing or not found (${CLI_PATH:-})\" >&2\n  exit 1\nfi\n\nif [[ -f \"$PROJECT_ROOT/.env\" ]]; then\n  set -a\n  source \"$PROJECT_ROOT/.env\"\n  set +a\nfi\n\n`\"$NODE_BINARY\" --print \"require('path').dirname(require.resolve('react-native/package.json')) + '/scripts/react-native-xcode.sh'\"`\n";
