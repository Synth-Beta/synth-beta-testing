kind = "web"
previewPath = "/"
title = "Synth - Find Friends for Local Events"
version = "1.0.0"
id = "artifacts/synth"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20058

[services.development]
run = "pnpm --filter @workspace/synth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synth", "run", "build" ]
publicDir = "artifacts/synth/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20058"
BASE_PATH = "/"
