kind = "mobile"
previewPath = "/synth-mobile"
title = "Synth Mobile"
version = "1.0.0"
id = "artifacts/synth-mobile"
router = "path"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/synth-mobile" ]
localPort = 20059

[services.development]
run = "pnpm --filter @workspace/synth-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synth-mobile", "run", "build" ]
run = "pnpm --filter @workspace/synth-mobile run serve"

[services.env]
PORT = "20059"
