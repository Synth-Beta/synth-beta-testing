kind = "mobile"
previewPath = "/synth-mobile/"
title = "Synth Mobile"
version = "1.0.0"
id = "artifacts/synth-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/synth-mobile/" ]
localPort = 20089

[services.development]
run = "pnpm --filter @workspace/synth-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synth-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/synth-mobile", "run", "serve" ]

[services.env]
PORT = "20089"
BASE_PATH = "/synth-mobile/"
