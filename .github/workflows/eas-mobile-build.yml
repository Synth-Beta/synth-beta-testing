name: EAS Mobile Build

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'mobile/**'
    paths:
      - 'mobile/**'
      - 'packages/synth-shared/**'
      - '.github/workflows/eas-mobile-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run checkout/setup-node on Node 24+ (Node 20 runtime for Actions is deprecated on GitHub-hosted runners).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify monorepo shared package
        working-directory: .
        run: test -d packages/synth-shared/src

      - name: Check EXPO_TOKEN
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "Missing EXPO_TOKEN secret. Add it in GitHub repo settings: Secrets and variables > Actions."
              exit 1
            fi
            echo "EXPO_TOKEN secret is not set; skipping EAS build on push."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.expo.outputs.present == 'true'
        run: npm ci

      - name: Build with EAS (push => both platforms)
        if: github.event_name == 'push' && steps.expo.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform all --profile production --non-interactive

      - name: Build with EAS (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.expo.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
