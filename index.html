<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FF3399" />
    <title>Synth - Find Friends for Local Events</title>
    <meta name="description" content="Discover local events and find others to attend with. Never go to shows, concerts, or activities alone again with PlusOne." />
    <meta name="author" content="PlusOne" />
    <meta name="keywords" content="events, local events, find friends, event discovery, social, community, concerts, activities" />

    <meta property="og:title" content="PlusOne - Find Friends for Local Events" />
    <meta property="og:description" content="Discover local events and find others to attend with. Never go to shows, concerts, or activities alone again with PlusOne." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@plusone_events" />
    <meta name="twitter:image" content="/favicon.png" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var eventId = u.searchParams.get('event');
          var reviewId = u.searchParams.get('review');
          var artistId = u.searchParams.get('artist');
          var venueId = u.searchParams.get('venue');
          var ref = u.searchParams.get('ref');
          var onSharePath = u.pathname === '/share' || u.pathname === '/share/';

          if (!eventId && !reviewId && !artistId && !venueId && !onSharePath) return;

          var type = eventId ? 'event' : reviewId ? 'review' : artistId ? 'artist' : venueId ? 'venue' : null;
          var id = eventId || reviewId || artistId || venueId;
          if (!id && onSharePath) return;

          var pending = { type: type, id: id, referrerId: ref };
          sessionStorage.setItem('synth_pending_share_link', JSON.stringify(pending));

          if (onSharePath && type && id) {
            var q = type + '=' + encodeURIComponent(id);
            if (ref) q += '&ref=' + encodeURIComponent(ref);
            window.location.replace('/?' + q);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
